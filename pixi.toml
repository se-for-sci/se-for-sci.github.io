[workspace]
name = "se-for-sci"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[dependencies]
black = "*"
cattrs = "*"
cffi = "*"
ipykernel = ">=6.0"
ipython = ">=8.0"
ipywidgets = "*"
mystmd = "*"
jupyterlab = ">=3"
line_profiler = "*"
matplotlib = ">=3.5"
mypy = ">=1"
nb_conda_kernels = "*"
numba = "*"
numpy = ">=1.20"
pandas = ">=1.3"
pip = ">=22"
pybind11 = ">=2.10"
pytest = ">7"
rich = ">=11"
scikit-build-core = ">=0.8"
scipy = "*"
ninja = ">=1.10"

[tasks]
lab = "jupyter lab"
book = "python -m ipykernel install --user --name conda-env-se-for-sci-py && myst build --execute --html"
serve = "python -m ipykernel install --user --name conda-env-se-for-sci-py && myst start --execute"
pdf = "python -m ipykernel install --user --name conda-env-se-for-sci-py && myst build --execute --pdf"
